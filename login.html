<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.tailwindcss.com">
</script>
</head>
<body>
    
<section class="flex items-center justify-center min-h-screen bg-center bg-cover" style="background-image: url('img/fondo_login_1.jpg');">
    <!-- Contenedor principal: Oscuro y ligeramente transparente para que se vea tu fondo -->
    <div class="w-full max-w-5xl px-8 py-12 mx-4 bg-[#161925]/90 backdrop-blur-sm border border-gray-800 shadow-2xl rounded-2xl lg:px-16 lg:py-20 sm:mx-auto">
        
        <div class="flex flex-col-reverse lg:flex-row lg:justify-between lg:items-center">
            
            <!-- Sección Izquierda: Formulario -->
            <div class="w-full mt-10 lg:w-1/2 lg:mt-0 lg:pr-12">
                <form>
                    <!-- Input Email -->
                    <div class="relative flex items-center mb-6">
                        <input type="email" class="block w-full py-3 pl-4 pr-11 text-gray-300 bg-transparent border border-gray-700 rounded-lg focus:border-blue-500 focus:ring-blue-500 focus:outline-none focus:ring focus:ring-opacity-40 placeholder-gray-500" placeholder="Email address">
                        <span class="absolute right-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </span>
                    </div>

                    <!-- Input Password -->
                    <div class="relative flex items-center mb-6">
                        <input type="password" class="block w-full py-3 pl-4 pr-11 text-gray-300 bg-transparent border border-gray-700 rounded-lg focus:border-blue-500 focus:ring-blue-500 focus:outline-none focus:ring focus:ring-opacity-40 placeholder-gray-500" placeholder="Password">
                        <span class="absolute right-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                    </div>

                    <!-- Botón y Enlace -->
                    <div class="flex items-center justify-between mt-8">
                        <a href="#" class="text-sm text-blue-400 transition-colors hover:text-blue-300 hover:underline">
                            ?Forgot your password
                        </a>
                        
                        <button class="w-1/2 px-6 py-3 text-sm font-medium tracking-wide text-white transition-colors duration-300 transform bg-[#4285F4] rounded-lg hover:bg-blue-500 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-50">
                            Sign In
                        </button>
                    </div>
                </form>
            </div>

            <!-- Sección Derecha: Títulos y Logo -->
            <div class="w-full mb-8 lg:w-1/2 flex flex-col items-start lg:items-end lg:text-right lg:mb-0">
                <img class="w-auto h-8 mb-6" src="https://merakiui.com/images/logo.svg" alt="Logo">
                <h2 class="text-gray-400 text-md">Welcome back</h2>
                <h1 class="mt-2 text-3xl font-bold text-white tracking-wide">
                    Login To Your Account
                </h1>
            </div>
        </div>

        <!-- Footer: Volver al inicio (Alineado a la derecha) -->
        <div class="mt-16 lg:mt-24 pt-8 flex justify-end">
            <a href="index.html" class="inline-flex items-center text-gray-400 hover:text-blue-400 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="text-sm font-medium">Volver</span>
            </a>
        </div>
    </div>
</section>
</body>
</html>
