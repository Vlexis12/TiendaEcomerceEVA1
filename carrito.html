<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | SneakerX</title>
    <script src="https://cdn.tailwindcss.com">
</script>
</head>
<body class="min-h-screen bg-[#f3f4f6] text-slate-900 antialiased">
<header class="border-b border-slate-200 bg-white">
<nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 lg:px-8">
<a href="index.html" class="flex items-center gap-3">
<span class="grid h-10 w-10 place-items-center rounded-xl bg-[#111827] text-lg font-black text-white">S</span>
<span>
<strong class="block text-lg tracking-tight">SneakerX</strong>
<small class="block text-[10px] font-semibold tracking-[0.22em] text-slate-400">MOVE DIFFERENT</small>
</span>
</a>
<div class="flex items-center gap-6 text-sm font-medium text-slate-500">
<a href="productos.html" class="transition hover:text-slate-900">Catálogo</a>
<a href="login.html" class="rounded-xl bg-[#111827] px-4 py-2.5 text-white transition hover:bg-slate-700">Ingresar</a>
</div>
</nav>
</header>
<main class="mx-auto max-w-6xl px-6 py-12 lg:px-8 lg:py-16">
<div class="mb-10">
<p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">Tu selección</p>
<h1 class="mt-2 text-4xl font-bold tracking-tight">Carrito</h1>
</div>
<div class="grid gap-8 lg:grid-cols-[1fr_360px]">
<section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
<ul id="lista-carrito-pagina" class="space-y-4">
</ul>
</section>
<aside class="h-fit rounded-2xl bg-[#111827] p-6 text-white">
<h2 class="text-lg font-bold">Resumen de compra</h2>
<dl class="mt-8 space-y-4 text-sm">
<div class="flex justify-between text-slate-400">
<dt>Subtotal</dt>
<dd id="resumen-subtotal">$0</dd>
</div>
<div class="flex justify-between text-slate-400">
<dt>IVA (19%)</dt>
<dd id="resumen-iva">$0</dd>
</div>
<div class="flex justify-between border-t border-white/10 pt-4 text-lg font-bold">
<dt>Total</dt>
<dd id="resumen-total">$0</dd>
</div>
</dl>
<a href="pago.html" class="mt-8 flex items-center justify-center rounded-xl bg-white px-6 py-3 text-sm font-semibold text-[#111827] transition hover:bg-slate-200">Pagar ahora</a>
<a href="productos.html" class="mt-4 block text-center text-sm text-slate-400 transition hover:text-white">Seguir comprando</a>
</aside>
</div>
</main>
<script src="js/productos.js">
</script>
</body>
</html>
