<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-100">
        <div class="container flex flex-col items-center justify-between px-6 py-4 mx-auto md:flex-row">
            <a href="index.html" class="mx-auto md:mx-0">
                <img class="w-auto h-8 md:h-10" src="img/logo.png" alt="Logo SneakersX">
            </a>    

            <!-- Menú Central -->
            <div class="flex items-center justify-center mt-4 text-sm font-bold text-slate-800 md:mt-0">
                <a href="carrito.html" class="px-2 pb-1 border-b-2 border-blue-600">Carrito de Compras</a>
            </div>

            <div class="hidden md:block">
                <a href="login.html" class="px-5 py-2.5 text-sm font-semibold text-blue-600 transition-colors border-2 border-blue-600 rounded-xl hover:bg-blue-600 hover:text-white">
                    Login
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal a dos columnas -->
    <main class="container mx-auto max-w-7xl px-6 py-12">
        <div class="flex flex-col lg:flex-row gap-10">
            
            <!-- Columna Izquierda: Lista de Productos -->
            <div class="lg:w-2/3">
                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Tu Carrito</h1>
                    <a href="productos.html" class="text-sm font-semibold text-blue-600 hover:underline">Seguir comprando</a>
                </div>

                <!-- Contenedor de la lista -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <ul id="lista-carrito-pagina" class="divide-y divide-slate-100">
                        <!-- JS inyecta los productos aquí -->
                    </ul>
                </div>
            </div>

            <!-- Columna Derecha: Resumen de Orden -->
            <div class="lg:w-1/3">
                <div class="bg-white rounded-3xl p-8 shadow-xl shadow-slate-200/50 border border-slate-100 sticky top-10">
                    <h3 class="text-lg font-black text-slate-900 mb-6">Resumen del pedido</h3>
                    
                    <!-- Filler Visual: Código de descuento -->
                    <div class="mb-6 relative">
                        <input type="text" placeholder="¿Tienes un cupón?" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 px-4 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        <button class="absolute right-2 top-2 bottom-2 bg-slate-900 text-white px-4 text-xs font-bold rounded-lg hover:bg-slate-800 transition-colors">Aplicar</button>
                    </div>

                    <!-- Desglose de Totales -->
                    <div class="space-y-4 text-sm text-slate-600 mb-6 pb-6 border-b border-slate-100">
                        <div class="flex justify-between items-center">
                            <span>Subtotal</span>
                            <span id="resumen-subtotal" class="font-medium text-slate-900">$0</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span>IVA (19%)</span>
                            <span id="resumen-iva" class="font-medium text-slate-900">$0</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span>Costo de envío</span>
                            <span class="font-bold text-green-500 bg-green-50 px-2 py-1 rounded-md text-xs uppercase tracking-wide">Gratis</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-base font-bold text-slate-900">Total a pagar</span>
                        <span id="resumen-total" class="text-3xl font-black text-[#2A65F3]">$0</span>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="space-y-3">
                        <button class="flex items-center justify-center w-full px-6 py-4 text-sm font-bold tracking-wide text-white bg-[#2A65F3] rounded-xl shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all hover:-translate-y-1">
                            Proceder al Pago
                            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>

                    <!-- Filler Visual: Insignias de confianza -->
                    <div class="mt-8 flex justify-center items-center gap-6 border-t border-slate-100 pt-6">
                        <div class="flex flex-col items-center text-slate-400">
                            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <span class="text-[10px] font-medium uppercase tracking-wider">Pago Seguro</span>
                        </div>
                        <div class="flex flex-col items-center text-slate-400">
                            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                            <span class="text-[10px] font-medium uppercase tracking-wider">Garantía</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/productos.js"></script>
</body>
</html>
