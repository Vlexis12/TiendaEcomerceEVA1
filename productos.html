<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | SneakerX</title>
    <script src="https://cdn.tailwindcss.com">
</script>
</head>
<body class="min-h-screen bg-[#f3f4f6] text-slate-900 antialiased">
<header class="border-b border-slate-200 bg-white">
<nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 lg:px-8">
<a href="index.html" class="flex items-center gap-3">
<span class="grid h-10 w-10 place-items-center rounded-xl bg-[#111827] text-lg font-black text-white">S</span>
<span>
<strong class="block text-lg tracking-tight">SneakerX</strong>
<small class="block text-[10px] font-semibold tracking-[0.22em] text-slate-400">Movimiento Diferente</small>
</span>
</a>
<div class="hidden items-center gap-8 text-sm font-medium text-slate-500 md:flex">
<a href="index.html" class="transition hover:text-slate-900">Inicio</a>
<a href="productos.html" class="border-b-2 border-[#111827] pb-1 text-slate-900">Catálogo</a>
<a href="nosotros.html" class="transition hover:text-slate-900">Nosotros</a>
</div>
<div class="flex items-center gap-3">
<button id="btn-carrito" class="relative rounded-xl border border-slate-200 p-2.5 text-slate-700 transition hover:border-slate-900" aria-label="Abrir carrito">
<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.836L5.5 6.75m0 0h13.386c.806 0 1.38.785 1.13 1.552l-1.5 4.5a1.125 1.125 0 0 1-1.07.768H8.03a1.125 1.125 0 0 1-1.07-.768L5.5 6.75Zm2.25 9.75h10.125M9 19.5a1.125 1.125 0 1 1-2.25 0A1.125 1.125 0 0 1 9 19.5Zm8.25 0a1.125 1.125 0 1 1-2.25 0 1.125 1.125 0 0 1 2.25 0Z" />
</svg>
<span id="contador-carrito" class="absolute -right-2 -top-2 hidden rounded-full bg-[#111827] px-1.5 py-0.5 text-[10px] font-bold text-white">0</span>
</button>
<a href="login.html" class="hidden rounded-xl bg-[#111827] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 sm:inline-flex">Ingresar</a>
</div>
</nav>
</header>
<main class="mx-auto max-w-7xl px-6 py-12 lg:px-8 lg:py-16">
<div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
<div>
<p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">Selección SneakerX</p>
<h1 class="mt-2 text-4xl font-bold tracking-tight sm:text-5xl">Elige tu próximo par.</h1>
<p class="mt-4 max-w-xl text-slate-500">Siluetas todos los días.</p>
</div>
<span class="rounded-full bg-white px-4 py-2 text-sm font-medium text-slate-500 ring-1 ring-slate-200">Colección 2026</span>
</div>
<div id="grid-productos" class="mt-10 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
</div>
</main>
<div id="carrito" class="relative z-50 hidden">
<div class="fixed inset-0 bg-slate-950/50">
</div>
<div class="fixed inset-0 overflow-hidden">
<div class="absolute inset-0 overflow-hidden">
<div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
<div class="pointer-events-auto w-screen max-w-md">
<div class="flex h-full flex-col overflow-y-scroll bg-white shadow-2xl">
<div class="flex-1 px-5 py-6 sm:px-6">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold" id="slide-over-title">Tu carrito <span id="cantidad-carrito-total" class="font-normal text-slate-400">
</span>
</h2>
<button type="button" id="cerrar-carrito" class="p-2 text-2xl leading-none text-slate-400 hover:text-slate-900" aria-label="Cerrar carrito">×</button>
</div>
<div class="mt-8">
<ul id="lista-carrito" class="divide-y divide-slate-200">
</ul>
</div>
</div>
<div class="border-t border-slate-200 px-5 py-6 sm:px-6">
<a href="carrito.html" class="flex items-center justify-center rounded-xl bg-[#111827] px-6 py-3 text-sm font-semibold text-white transition hover:bg-slate-700">Ver carrito completo</a>
<div class="mt-5 text-center text-sm text-slate-500">
<button type="button" id="continuar-comprando" class="font-semibold text-slate-900 hover:underline">Continuar comprando</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script src="js/productos.js">
</script>
</body>
</html>
