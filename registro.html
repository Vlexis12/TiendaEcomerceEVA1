<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | SneakerX</title>
    <script src="https://cdn.tailwindcss.com">
</script>
</head>
<body class="min-h-screen bg-[#f3f4f6] text-slate-900 antialiased">
<header class="border-b border-slate-200 bg-white">
<nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 lg:px-8">
<a href="index.html" class="flex items-center gap-3">
<span class="grid h-10 w-10 place-items-center rounded-xl bg-[#111827] text-lg font-black text-white">S</span>
<span>
<strong class="block text-lg tracking-tight">SneakerX</strong>
<small class="block text-[10px] font-semibold tracking-[0.22em] text-slate-400">MOVE DIFFERENT</small>
</span>
</a>
<a href="login.html" class="text-sm font-semibold text-slate-600 transition hover:text-slate-900">Ya tengo una cuenta →</a>
</nav>
</header>
<main class="mx-auto grid min-h-[calc(100vh-86px)] max-w-7xl items-center gap-12 px-6 py-12 lg:grid-cols-[.85fr_1.15fr] lg:px-8">
<div class="hidden min-h-[620px] rounded-3xl bg-cover bg-center lg:block" style="background-image: url('img/fondo_registro_2.png');">
</div>
<section class="mx-auto w-full max-w-2xl rounded-3xl bg-white p-7 shadow-sm ring-1 ring-slate-200 sm:p-10">
<p class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">Únete a SneakerX</p>
<h1 class="mt-3 text-4xl font-bold tracking-tight">Crea tu cuenta.</h1>
<p class="mt-3 text-slate-500">Guarda tus favoritos y descubre nuevas formas de moverte.</p>
<form class="mt-8 grid gap-5 sm:grid-cols-2">
<label class="text-sm font-semibold text-slate-700">Nombre<input type="text" required placeholder="Alexis" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<label class="text-sm font-semibold text-slate-700">Apellido<input type="text" required placeholder="Rozas" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<label class="text-sm font-semibold text-slate-700">Teléfono<input type="tel" placeholder="+56 9 1234 5678" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<label class="text-sm font-semibold text-slate-700">Correo electrónico<input type="email" required placeholder="nombre@correo.com" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<label class="text-sm font-semibold text-slate-700">Contraseña<input type="password" required placeholder="Crea una contraseña" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<label class="text-sm font-semibold text-slate-700">Confirmar contraseña<input type="password" required placeholder="Repite tu contraseña" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 font-normal outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-100">
</label>
<button type="submit" class="mt-2 flex items-center justify-center rounded-xl bg-[#111827] px-6 py-4 text-sm font-semibold text-white transition hover:bg-slate-700 sm:col-span-2">Crear mi cuenta <span class="ml-2" aria-hidden="true">→</span>
</button>
</form>
</section>
</main>
</body>
</html>
